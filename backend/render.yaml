services:
  - type: web
    name: opensos-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: AI_MODEL
        value: gpt-4.1-mini
      - key: AI_API_KEY
        sync: false
      - key: AI_TIMEOUT_SECONDS
        value: 20

